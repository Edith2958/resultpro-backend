<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ledger — Invoices, Stock &amp; Debts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- FIREBASE: fill in your config in the script below, under FIREBASE CONFIG -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --paper:#F6F1E7;
    --card:#FFFDF8;
    --line:#DDD3BD;
    --line-soft:#EAE2D0;
    --ink:#22281F;
    --ink-soft:#5B6156;
    --green:#2F4B3C;
    --green-soft:#E4EAE3;
    --red:#A73B3B;
    --red-soft:#F3E3E1;
    --amber:#B8862E;
    --amber-soft:#F5EBD9;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  h1,h2,h3{font-family:'Arvo',serif;font-weight:700;margin:0;}

  .app-shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:var(--paper);
  }

  /* HEADER */
  header.top{
    padding:18px 18px 14px;
    border-bottom:2px solid var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  header.top .brand{display:flex;flex-direction:column;gap:2px;}
  header.top h1{font-size:21px;letter-spacing:-0.01em;}
  header.top .date{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  header.top button.gear{
    background:none;border:1px solid var(--line);border-radius:50%;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);cursor:pointer;
  }
  header.top button.gear:active{background:var(--line-soft);}

  main{flex:1;overflow-y:auto;padding:14px 18px 90px;}

  /* SECTION HEADER ROW */
  .section-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .section-row h2{font-size:17px;}
  .totals-strip{
    display:flex;gap:10px;margin-bottom:16px;
  }
  .totals-strip .stat{
    flex:1;border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 12px;background:var(--card);
  }
  .totals-strip .stat .label{font-size:10.5px;color:var(--ink-soft);}
  .totals-strip .stat .value{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;margin-top:2px;}

  /* LEDGER ROWS (list) */
  .ledger{border-top:1px solid var(--line);}
  .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 2px;border-bottom:1px solid var(--line-soft);
    cursor:pointer;
  }
  .row:active{background:var(--line-soft);}
  .row .left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .row .title{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .sub{font-size:11.5px;color:var(--ink-soft);}
  .row .right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;padding-left:10px;}
  .row .amount{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:600;}
  .pill{
    font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:0.02em;
  }
  .pill.paid{background:var(--green-soft);color:var(--green);}
  .pill.credit{background:var(--red-soft);color:var(--red);}
  .pill.partial{background:var(--amber-soft);color:var(--amber);}
  .pill.voided{background:var(--line-soft);color:var(--ink-soft);}
  .pill.ok{background:var(--green-soft);color:var(--green);}
  .pill.low{background:var(--amber-soft);color:var(--amber);}
  .pill.out{background:var(--red-soft);color:var(--red);}

  .empty{
    text-align:center;padding:50px 20px;color:var(--ink-soft);
  }
  .empty h3{font-family:'Inter',sans-serif;font-size:14.5px;color:var(--ink);margin-bottom:5px;}
  .empty p{font-size:12.5px;margin:0;}

  /* BOTTOM NAV */
  nav.bottom{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;
    background:var(--card);border-top:2px solid var(--ink);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.bottom button{
    flex:1;background:none;border:none;padding:9px 4px 8px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-soft);cursor:pointer;font-family:'Inter',sans-serif;font-size:10px;font-weight:600;
  }
  nav.bottom button.active{color:var(--ink);}
  nav.bottom button svg{width:20px;height:20px;}
  nav.bottom button.active svg{stroke:var(--ink);}

  /* BUTTONS */
  button.primary{
    background:var(--ink);color:var(--paper);border:none;border-radius:var(--radius);
    padding:12px 16px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;
  }
  button.primary:active{opacity:0.85;}
  button.secondary{
    background:none;color:var(--ink);border:1px solid var(--ink);border-radius:var(--radius);
    padding:11px 16px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;
  }
  button.danger{color:var(--red);border-color:var(--red);}
  button.block{width:100%;}
  .fab{
    position:fixed;bottom:78px;left:50%;
    transform:translateX(calc(-50% + 190px));
    width:50px;height:50px;border-radius:50%;
    background:var(--ink);color:var(--paper);border:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.25);cursor:pointer;
    font-size:24px;
  }

  /* MODAL / SHEET */
  .overlay{
    position:fixed;inset:0;background:rgba(34,40,31,0.45);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .sheet{
    background:var(--paper);width:100%;max-width:480px;
    max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;
    padding:18px 18px calc(24px + env(safe-area-inset-bottom));
    animation:slideup 0.22s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:0.4;}to{transform:translateY(0);opacity:1;}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .sheet-head h2{font-size:18px;}
  .sheet-head button.close{background:none;border:none;color:var(--ink-soft);font-size:22px;cursor:pointer;line-height:1;padding:4px;}

  label{display:block;font-size:11.5px;color:var(--ink-soft);margin:12px 0 5px;font-weight:600;}
  input,select,textarea{
    width:100%;border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 11px;font-family:'Inter',sans-serif;font-size:14.5px;background:var(--card);color:var(--ink);
  }
  input.num-input{font-family:'IBM Plex Mono',monospace;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);}
  .row-2{display:flex;gap:10px;}
  .row-2 > div{flex:1;}

  .item-line{
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius);
    padding:9px 10px;margin-bottom:8px;background:var(--card);
  }
  .item-line .info{flex:1;min-width:0;}
  .item-line .info .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-line .info .p{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .qty-stepper{display:flex;align-items:center;gap:6px;}
  .qty-stepper button{
    width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
    font-size:15px;cursor:pointer;color:var(--ink);
  }
  .qty-stepper span{width:22px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13.5px;}
  .item-line .lt{width:62px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;}
  .item-line .rm{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:2px 4px;}

  .total-line{display:flex;justify-content:space-between;padding-top:12px;margin-top:6px;border-top:2px solid var(--ink);}
  .total-line .l{font-family:'Arvo',serif;font-size:15px;}
  .total-line .v{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;}

  .toggle-group{display:flex;gap:8px;}
  .toggle-group button{
    flex:1;padding:9px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--card);color:var(--ink-soft);font-weight:600;font-size:13px;cursor:pointer;
  }
  .toggle-group button.sel{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .search-add{position:relative;}
  .suggest{
    position:absolute;top:100%;left:0;right:0;background:var(--card);
    border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius);
    max-height:220px;overflow-y:auto;z-index:10;box-shadow:0 6px 14px rgba(0,0,0,0.08);
  }
  .suggest .opt{padding:10px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer;display:flex;justify-content:space-between;}
  .suggest .opt:active{background:var(--line-soft);}
  .suggest .opt .n{font-size:13.5px;}
  .suggest .opt .s{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}

  .scanbox{
    background:#111;border-radius:var(--radius);overflow:hidden;position:relative;
    aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;margin-bottom:10px;
  }
  .scanbox video{width:100%;height:100%;object-fit:cover;}
  .scan-note{font-size:11.5px;color:var(--ink-soft);text-align:center;padding:6px 0;}

  /* DETAIL VIEW */
  .detail-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .detail-card .dl-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;}
  .detail-card .dl-row .k{color:var(--ink-soft);}
  .detail-card .dl-row .v{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .back-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer;margin-bottom:12px;padding:2px;}

  /* PRINT AREA (hidden on screen) */
  #print-area{display:none;}

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{
      display:block;position:absolute;top:0;left:0;width:72mm;
      font-family:'IBM Plex Mono',monospace;font-size:11px;color:#000;padding:6mm;
    }
    #print-area .pr-shop{font-family:'Arvo',serif;font-size:15px;font-weight:700;text-align:center;}
    #print-area .pr-sub{text-align:center;font-size:9.5px;margin-bottom:6px;}
    #print-area hr{border:none;border-top:1px dashed #000;margin:6px 0;}
    #print-area .pr-row{display:flex;justify-content:space-between;font-size:10.5px;padding:2px 0;}
    #print-area .pr-tot{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding-top:4px;}
    #print-area .pr-foot{text-align:center;font-size:9.5px;margin-top:10px;}
  }

  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:20px;
    font-size:12.5px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.2s;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="app-shell" id="app"></div>
<div class="toast" id="toast"></div>

<div id="print-area">
  <img id="pr-logo" src="" alt="" style="max-height:48px;max-width:120px;margin:0 auto 4px;display:none;">
  <div class="pr-shop" id="pr-shop"></div>
  <div class="pr-sub" id="pr-meta"></div>
  <hr>
  <div id="pr-items"></div>
  <hr>
  <div class="pr-tot"><span>TOTAL</span><span id="pr-total"></span></div>
  <div class="pr-row" id="pr-status-row"></div>
  <div class="pr-row" id="pr-balance-row"></div>
  <div class="pr-row" id="pr-soldby-row"></div>
  <div id="pr-qr" style="width:90px;margin:8px auto 2px;"></div>
  <div id="pr-qr-caption" style="text-align:center;font-size:8.5px;display:none;">Scan for a WhatsApp copy</div>
  <div class="pr-foot">Thank you</div>
</div>

<script>
(function(){
  "use strict";

  // ---------- STATE ----------
  function blankShopState(){
    return {
      shopName: "My Shop",
      currency: "$",
      lowStock: 5,
      products: [],
      customers: [],
      invoices: [],
      nextInvoiceNo: 1001,
      roles: {},
      staffNames: {}
    };
  }
  function staffName(email){
    if(!email) return '';
    if(state.staffNames && state.staffNames[email]) return state.staffNames[email];
    return email.split('@')[0];
  }
  var state = blankShopState();
  var view = "invoices"; // invoices | inventory | debts
  var sheet = null; // current open sheet descriptor
  var detail = null; // {type:'invoice'|'customer', id}
  var loaded = false;

  // ---------- FIREBASE CONFIG ----------
  // Get these values from Firebase Console > Project settings > General > Your apps > SDK setup and config
  var firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  var db = null;
  var auth = null;
  var firebaseReady = false;
  var currentUser = null;
  var shopId = null; // which Firestore document this device is currently synced to
  var userShops = []; // list of {id, name} shops this signed-in user belongs to
  var unsubscribe = null;
  var suppressNextSnapshot = false;

  try{
    if(firebaseConfig.apiKey !== "YOUR_API_KEY" && typeof firebase !== 'undefined'){
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      auth = firebase.auth();
      firebaseReady = true;
    }
  }catch(e){ firebaseReady = false; }

  // ---------- AUTH ----------
  async function signUp(email, password){
    try{
      await auth.createUserWithEmailAndPassword(email, password);
    }catch(e){ showToast(authErrorMessage(e)); }
  }
  async function signIn(email, password){
    try{
      await auth.signInWithEmailAndPassword(email, password);
    }catch(e){ showToast(authErrorMessage(e)); }
  }
  async function sendReset(email){
    try{
      await auth.sendPasswordResetEmail(email);
      showToast('Reset email sent — check your inbox');
    }catch(e){ showToast(authErrorMessage(e)); }
  }
  function signOutUser(){
    if(unsubscribe) unsubscribe();
    unsubscribe = null;
    shopId = null;
    auth.signOut();
  }
  function authErrorMessage(e){
    var code = e && e.code || '';
    if(code.indexOf('wrong-password')>-1 || code.indexOf('invalid-credential')>-1) return 'Wrong email or password';
    if(code.indexOf('user-not-found')>-1) return 'No account with that email';
    if(code.indexOf('email-already-in-use')>-1) return 'That email already has an account — sign in instead';
    if(code.indexOf('weak-password')>-1) return 'Password should be at least 6 characters';
    if(code.indexOf('invalid-email')>-1) return 'That email address looks invalid';
    return 'Something went wrong — try again';
  }

  // ---------- STORAGE ----------
  // Remembers which Shop ID this device should sync to (not the shop data itself, just the pointer).
  async function rememberShopId(id){
    shopId = id;
    try{ await window.storage.set('shop-id', id, false); }catch(e){}
  }
  async function recallShopId(){
    try{
      var res = await window.storage.get('shop-id', false);
      return res && res.value ? res.value : null;
    }catch(e){ return null; }
  }

  async function loadData(){
    if(firebaseReady){
      auth.onAuthStateChanged(async function(user){
        currentUser = user;
        if(!user){
          shopId = null; userShops = [];
          if(unsubscribe){ unsubscribe(); unsubscribe = null; }
          loaded = true; render(); // show sign-in gate
          return;
        }
        await listMyShops();
        var remembered = await recallShopId();
        if(remembered && userShops.some(function(s){ return s.id===remembered; })){
          subscribeToShop(remembered);
        } else {
          shopId = null;
          loaded = true; render(); // show the shop picker
        }
      });
      return;
    }
    // Local-only fallback (no Firebase configured yet)
    try{
      var res = await window.storage.get('shop-data', false);
      if(res && res.value){
        var parsed = JSON.parse(res.value);
        state = Object.assign(state, parsed);
      }
    }catch(e){ /* no data yet */ }
    loaded = true;
    render();
  }

  async function listMyShops(){
    if(!firebaseReady || !currentUser) { userShops = []; return; }
    try{
      var snap = await db.collection('shops').where('allowedEmails', 'array-contains', currentUser.email).get();
      userShops = snap.docs.map(function(d){ return { id: d.id, name: (d.data().shopName || d.id) }; });
    }catch(e){
      console.error('listMyShops error:', e);
      userShops = [];
    }
  }

  async function deleteShop(){
    if(!shopId) return;
    var id = shopId;
    if(unsubscribe){ unsubscribe(); unsubscribe = null; }
    try{
      await db.collection('shops').doc(id).delete();
      showToast('Shop deleted');
    }catch(e){
      console.error('Delete shop failed:', e);
      showToast('Could not delete shop: '+(e&&e.code?e.code:'permission denied'));
      subscribeToShop(id); // re-subscribe since delete failed
      return;
    }
    shopId = null;
    state = blankShopState();
    await listMyShops();
    render();
  }

  async function removeMember(email){
    if(currentUser && email===currentUser.email){ showToast("You can't remove yourself"); return; }
    state.allowedEmails = (state.allowedEmails||[]).filter(function(e){ return e!==email; });
    if(state.roles) delete state.roles[email];
    await saveData();
    showToast(email+' removed from this shop');
  }

  function switchShop(){
    if(unsubscribe){ unsubscribe(); unsubscribe = null; }
    shopId = null;
    listMyShops().then(function(){ render(); });
  }

  function subscribeToShop(id){
    if(unsubscribe) unsubscribe();
    unsubscribe = db.collection('shops').doc(id).onSnapshot(function(doc){
      if(suppressNextSnapshot){ suppressNextSnapshot = false; }
      if(doc.exists){
        state = Object.assign(state, doc.data());
      } else {
        // First device to use this Shop ID — start from a clean slate (not whatever
        // shop was previously loaded on this device) and make the creator the first allowed user.
        state = Object.assign(blankShopState(), { allowedEmails: [currentUser.email], roles: { } });
        state.roles[currentUser.email] = 'owner';
        suppressNextSnapshot = true;
        db.collection('shops').doc(id).set(state).then(function(){
          listMyShops();
        }).catch(function(err){
          console.error('Shop creation failed:', err);
          showToast('Could not create shop: ' + (err && err.message ? err.message : 'permission denied'));
        });
      }
      loaded = true;
      render();
    }, function(err){
      console.error('Firestore subscribe error:', err);
      showToast('Sync error: ' + (err && err.code ? err.code : 'check access or connection'));
      loaded = true; render();
    });
  }

  async function saveData(){
    if(firebaseReady && shopId){
      try{
        suppressNextSnapshot = true;
        await db.collection('shops').doc(shopId).set(state);
      }catch(e){
        showToast("Couldn't sync to cloud — try again");
      }
      return;
    }
    try{
      await window.storage.set('shop-data', JSON.stringify(state), false);
    }catch(e){
      showToast("Couldn't save — try again");
    }
  }

  async function connectToShop(id){
    id = id.trim();
    if(!id){ showToast('Enter a Shop ID'); return; }
    await rememberShopId(id);
    subscribeToShop(id);
  }

  async function inviteTeammate(email, role){
    email = email.trim().toLowerCase();
    if(!email){ showToast('Enter an email'); return; }
    if(!state.allowedEmails) state.allowedEmails = [];
    if(!state.roles) state.roles = {};
    // Self-heal: if this shop predates roles, make sure the current signed-in
    // user (who must be the de-facto owner to be inviting anyone) is recorded as one.
    if(Object.keys(state.roles).length===0){ state.roles[currentUser.email] = 'owner'; }
    if(state.allowedEmails.indexOf(email) === -1){
      state.allowedEmails.push(email);
      state.roles[email] = (role==='owner') ? 'owner' : 'staff';
      await saveData();
      showToast(email+' invited as '+(state.roles[email])+ ' — they can now sign up and join');
    } else {
      showToast('Already invited');
    }
  }

  async function setMemberRole(email, role){
    if(!state.roles) state.roles = {};
    if(Object.keys(state.roles).length===0){ state.roles[currentUser.email] = 'owner'; }
    state.roles[email] = role;
    await saveData();
    showToast(email+' is now '+role);
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function fmt(n){
    var v = Math.round((n||0)*100)/100;
    var neg = v<0; v = Math.abs(v);
    var parts = v.toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg?'-':'') + state.currency + parts.join('.');
  }
  function todayStr(){
    var d = new Date();
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  }

    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  // ---------- DERIVED ----------
  function outstandingTotal(){
    return state.customers.reduce(function(s,c){ return s + (c.balance||0); }, 0);
  }
  function stockValue(){
    return state.products.reduce(function(s,p){ return s + p.qty*p.price; }, 0);
  }
  function lowStockCount(){
    return state.products.filter(function(p){ return p.qty <= (state.lowStock) && p.qty > 0; }).length;
  }

  // ---------- RENDER ROOT ----------
  function render(){
    var app = document.getElementById('app');
    if(!loaded){ app.innerHTML = '<div class="empty" style="padding-top:120px;">Loading…</div>'; return; }

    if(firebaseReady && !currentUser){ renderAuthGate(app); return; }
    if(firebaseReady && !shopId){ renderShopPickerGate(app); return; }

    var html = '';
    html += renderHeader();
    html += '<main>' + renderMain() + '</main>';
    html += renderNav();
    if(view==='invoices') html += '<button class="fab" id="fab-new" aria-label="New invoice">+</button>';

    app.innerHTML = html;
    attachRootEvents();
    if(sheet) renderSheet();
  }

  function renderAuthGate(app){
    var mode = window._authMode || 'signin'; // 'signin' | 'signup'
    app.innerHTML =
      '<div style="padding:60px 24px;text-align:center;">' +
        '<h1 style="font-size:22px;margin-bottom:8px;">'+(mode==='signup'?'Create your account':'Sign in')+'</h1>' +
        '<p style="font-size:13px;color:var(--ink-soft);margin-bottom:22px;">'+(mode==='signup'?'You\'ll use this to access your shop\'s data from any device.':'Enter the email and password you signed up with.')+'</p>' +
        '<label style="text-align:left;">Email</label>' +
        '<input id="auth-email" type="email" placeholder="you@business.com">' +
        '<label style="text-align:left;">Password</label>' +
        '<input id="auth-password" type="password" placeholder="At least 6 characters">' +
        '<button class="primary block" id="auth-submit" style="margin-top:16px;">'+(mode==='signup'?'Create account':'Sign in')+'</button>' +
        '<p style="font-size:12.5px;margin-top:16px;">' +
          (mode==='signup'
            ? 'Already have an account? <a href="#" id="auth-switch" style="color:var(--ink);">Sign in</a>'
            : 'New here? <a href="#" id="auth-switch" style="color:var(--ink);">Create an account</a>') +
        '</p>' +
        (mode==='signin' ? '<p style="font-size:12px;margin-top:6px;"><a href="#" id="auth-forgot" style="color:var(--ink-soft);">Forgot password?</a></p>' : '') +
      '</div>';
    document.getElementById('auth-submit').addEventListener('click', function(){
      var email = document.getElementById('auth-email').value.trim();
      var pw = document.getElementById('auth-password').value;
      if(!email || !pw){ showToast('Enter email and password'); return; }
      if(mode==='signup') signUp(email, pw); else signIn(email, pw);
    });
    document.getElementById('auth-switch').addEventListener('click', function(e){
      e.preventDefault();
      window._authMode = mode==='signup' ? 'signin' : 'signup';
      render();
    });
    var forgot = document.getElementById('auth-forgot');
    if(forgot) forgot.addEventListener('click', function(e){
      e.preventDefault();
      var email = document.getElementById('auth-email').value.trim();
      if(!email){ showToast('Type your email above first'); return; }
      sendReset(email);
    });
  }

          '<div class="right">→</div>' +

      });
      listHtml += '</div>';

      '<div style="padding:50px 24px 30px;text-align:center;">' +
        '<h1 style="font-size:22px;margin-bottom:8px;">'+(userShops.length? 'Choose a shop' : 'Connect this device')+'</h1>' +
        '<p style="font-size:13px;color:var(--ink-soft);margin-bottom:20px;">Signed in as <strong>'+escapeHtml(currentUser.email)+'</strong></p>' +

        '<label style="text-align:left;">'+(userShops.length? 'Or create a new shop' : 'Shop ID')+'</label>' +
        '<input id="gate-shopid" placeholder="e.g. mercy-store-2026" style="text-align:center;">' +
        '<button class="primary block" id="gate-connect" style="margin-top:16px;">'+(userShops.length? 'Create shop' : 'Connect')+'</button>' +

  function renderHeader(){
    var logoImg = state.shopLogo ? '<img src="'+state.shopLogo+'" alt="" style="height:32px;width:32px;object-fit:contain;border-radius:6px;margin-right:9px;">' : '';
    return '<header class="top">' +
      '<div class="brand" style="flex-direction:row;align-items:center;">'+logoImg+'<div><h1>'+escapeHtml(state.shopName)+'</h1><div class="date">'+todayStr()+'</div></div></div>' +
      '<button class="gear" id="btn-settings">'+ICONS.gear+'</button>' +
    '</header>';
  }

  function renderNav(){
    function btn(id,label){
      return '<button data-view="'+id+'" class="'+(view===id?'active':'')+'">'+ICONS[id]+'<span>'+label+'</span></button>';
    }
    return '<nav class="bottom">' +
      btn('invoices','Invoices') + btn('inventory','Stock') + (isOwner() ? btn('debts','Debts') : '') +
      '<button id="btn-scan">'+ICONS.scan+'<span>Scan</span></button>' +
    '</nav>';
  }

  function renderMain(){
    if(view==='debts' && !isOwner()){ view = 'invoices'; detail = null; }
    if(detail) return renderDetail();
    if(view==='invoices') return renderInvoicesList();
    if(view==='inventory') return renderInventoryList();
    if(view==='debts') return renderDebtsList();
    return '';
  }

  // ---------- INVOICES LIST ----------
  function renderInvoicesList(){
    var invs = state.invoices.slice().sort(function(a,b){ return b.createdAt-a.createdAt; });
    var todayCount = invs.filter(function(i){ return !i.voided && sameDay(i.createdAt, Date.now()); }).length;
    var todaySum = invs.filter(function(i){ return !i.voided && sameDay(i.createdAt, Date.now()); }).reduce(function(s,i){return s+i.total;},0);

    var html = '<div class="totals-strip">' +
      '<div class="stat"><div class="label">Today</div><div class="value">'+fmt(todaySum)+'</div></div>' +
      '<div class="stat"><div class="label">Outstanding</div><div class="value">'+fmt(outstandingTotal())+'</div></div>' +
    '</div>';

    html += '<div class="section-row"><h2>Invoices</h2>'+(isOwner() ? '<button class="secondary" id="btn-summary" style="padding:6px 12px;font-size:12.5px;">Summary</button>' : '')+'</div>';

    if(invs.length===0){
      html += '<div class="empty"><h3>No invoices yet</h3><p>Tap + to create your first invoice.</p></div>';
      return html;
    }

    html += '<div class="ledger">';
    invs.forEach(function(inv){
      var custName = invoiceCustName(inv);
      html += '<div class="row" data-open-invoice="'+inv.id+'" style="'+(inv.voided?'opacity:0.5;':'')+'">' +
        '<div class="left"><div class="title">'+escapeHtml(custName||'Walk-in')+'</div>' +
        '<div class="sub">#'+inv.number+' · '+new Date(inv.createdAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</div></div>' +
        '<div class="right"><div class="amount">'+fmt(inv.total)+'</div>' +
        '<span class="pill '+invPillClass(inv)+'">'+invPillLabel(inv)+'</span></div>' +
      '</div>';
    });
    html += '</div>';
    return html;
  }

  function sameDay(ts, ts2){
    var a=new Date(ts), b=new Date(ts2);
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  // ---------- INVENTORY LIST ----------
  function renderInventoryList(){
    var html = '<div class="totals-strip">' +
      '<div class="stat"><div class="label">Items</div><div class="value">'+state.products.length+'</div></div>' +
      '<div class="stat"><div class="label">Stock value</div><div class="value">'+fmt(stockValue())+'</div></div>' +
    '</div>';
    html += '<div class="section-row"><h2>Inventory</h2>'+(isOwner() ? '<button class="secondary" id="btn-add-product" style="padding:6px 12px;font-size:12.5px;">+ Item</button>' : '')+'</div>';

    if(state.products.length===0){
      html += '<div class="empty"><h3>No items yet</h3><p>Add products to start tracking stock.</p></div>';
      return html;
    }

    var sorted = state.products.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    html += '<div class="ledger">';
    sorted.forEach(function(p){
      var pillClass = p.qty<=0 ? 'out' : (p.qty<=state.lowStock ? 'low' : 'ok');
      var pillText = p.qty<=0 ? 'Out' : (p.qty<=state.lowStock ? 'Low' : 'In stock');
      html += '<div class="row" data-open-product="'+p.id+'">' +
        '<div class="left"><div class="title">'+escapeHtml(p.name)+'</div><div class="sub">SKU '+escapeHtml(p.sku||'—')+' · '+fmt(p.price)+'</div></div>' +
        '<div class="right"><div class="amount">'+p.qty+'</div><span class="pill '+pillClass+'">'+pillText+'</span></div>' +
      '</div>';
    });
    html += '</div>';
    return html;
  }

  // ---------- DEBTS LIST ----------
  function renderDebtsList(){
    var owing = state.customers.filter(function(c){ return (c.balance||0) > 0; }).sort(function(a,b){ return b.balance-a.balance; });
    var html = '<div class="totals-strip">' +
      '<div class="stat"><div class="label">Customers owing</div><div class="value">'+owing.length+'</div></div>' +
      '<div class="stat"><div class="label">Total owed</div><div class="value">'+fmt(outstandingTotal())+'</div></div>' +
    '</div>';
    html += '<div class="section-row"><h2>Debts</h2><button class="secondary" id="btn-add-customer" style="padding:6px 12px;font-size:12.5px;">+ Customer</button></div>';

    if(owing.length===0){
      html += '<div class="empty"><h3>All settled</h3><p>No customers currently owe you money.</p></div>';
    } else {
      html += '<div class="ledger">';
      owing.forEach(function(c){
        html += '<div class="row" data-open-customer="'+c.id+'">' +
          '<div class="left"><div class="title">'+escapeHtml(c.name)+'</div><div class="sub">'+(c.debtSince ? ('Owing '+daysAgo(c.debtSince)) : escapeHtml(c.phone||'No phone'))+'</div></div>' +
          '<div class="right"><div class="amount">'+fmt(c.balance)+'</div><span class="pill credit">Owing</span></div>' +
        '</div>';
      });
      html += '</div>';
    }
    return html;
  }

  // ---------- DETAIL VIEWS ----------
  function renderDetail(){
    if(detail.type==='invoice') return renderInvoiceDetail();
    if(detail.type==='customer') return renderCustomerDetail();
    if(detail.type==='product') return renderProductDetail();
    return '';
  }

  function renderInvoiceDetail(){
    var inv = state.invoices.find(function(i){ return i.id===detail.id; });
    if(!inv){ detail=null; return renderInvoicesList(); }
    var custName = invoiceCustName(inv);
    var html = '<button class="back-btn" id="btn-back">'+ICONS.back+' Back</button>';
    html += '<div class="detail-card">' +
      '<div class="dl-row"><span class="k">Invoice</span><span class="v">#'+inv.number+'</span></div>' +
      '<div class="dl-row"><span class="k">Customer</span><span class="v" style="font-family:Inter,sans-serif;">'+escapeHtml(custName||'Walk-in')+'</span></div>' +
      '<div class="dl-row"><span class="k">Date</span><span class="v">'+new Date(inv.createdAt).toLocaleString()+'</span></div>' +
      '<div class="dl-row"><span class="k">Status</span><span class="v" style="font-family:Inter,sans-serif;">'+invStatusLong(inv)+'</span></div>' +
      (inv.soldBy ? '<div class="dl-row"><span class="k">Sold by</span><span class="v" style="font-family:Inter,sans-serif;">'+escapeHtml(staffName(inv.soldBy))+'</span></div>' : '') +
    '</div>';

    if(inv.voided){
      html += '<div class="scan-note" style="text-align:left;background:var(--line-soft);padding:10px 12px;border-radius:3px;">This invoice was voided on '+new Date(inv.voidedAt).toLocaleString()+'. Stock and any debt it added have been reversed.</div>';
    }

    html += '<div class="section-row"><h2 style="font-size:14px;">Items</h2></div>';
    html += '<div class="ledger">';
    inv.items.forEach(function(it){
      html += '<div class="row" style="cursor:default;">' +
        '<div class="left"><div class="title">'+escapeHtml(it.name)+'</div><div class="sub">'+it.qty+' × '+fmt(it.price)+'</div></div>' +
        '<div class="right"><div class="amount">'+fmt(it.qty*it.price)+'</div></div>' +
      '</div>';
    });
    html += '</div>';
    html += '<div class="total-line"><span class="l">Total</span><span class="v">'+fmt(inv.total)+'</span></div>';
    if(inv.type==='partial'){
      html += '<div class="dl-row" style="margin-top:4px;"><span class="k">Paid now</span><span class="v">'+fmt(inv.amountPaid||0)+'</span></div>';
      html += '<div class="dl-row"><span class="k">Added to debt</span><span class="v" style="color:var(--red);">'+fmt(inv.total-(inv.amountPaid||0))+'</span></div>';
    }
    if(!inv.voided){
      html += '<div style="margin-top:18px;display:flex;gap:10px;">' +
        '<button class="primary block" id="btn-print-invoice">Print receipt</button>' +
      '</div>' +
      '<button class="secondary block" id="btn-whatsapp-invoice" style="margin-top:10px;">Share via WhatsApp</button>' +
      (isOwner() ? ('<div style="display:flex;gap:10px;margin-top:10px;">' +
        '<button class="secondary block" id="btn-edit-invoice">Edit</button>' +
        '<button class="secondary danger block" id="btn-void-invoice">Void</button>' +
      '</div>') : '');
    } else {
      html += '<div style="margin-top:18px;">' +
        '<button class="primary block" id="btn-print-invoice">Print receipt</button>' +
      '</div>';
    }
    return html;
  }

  function renderCustomerDetail(){
    var c = state.customers.find(function(x){ return x.id===detail.id; });
    if(!c){ detail=null; return renderDebtsList(); }
    var custInvoices = state.invoices.filter(function(i){ return i.customerId===c.id; }).sort(function(a,b){return b.createdAt-a.createdAt;});
    var payments = (c.payments||[]).slice().sort(function(a,b){return b.date-a.date;});
    var html = '<button class="back-btn" id="btn-back">'+ICONS.back+' Back</button>';
    html += '<div class="detail-card">' +
      '<div class="dl-row"><span class="k">Customer</span><span class="v" style="font-family:Inter,sans-serif;">'+escapeHtml(c.name)+'</span></div>' +
      '<div class="dl-row"><span class="k">Phone</span><span class="v" style="font-family:Inter,sans-serif;">'+escapeHtml(c.phone||'—')+'</span></div>' +
      '<div class="dl-row"><span class="k">Balance owed</span><span class="v" style="color:'+(c.balance>0?'var(--red)':'var(--green)')+';">'+fmt(c.balance||0)+'</span></div>' +
      ((c.balance>0 && c.debtSince) ? '<div class="dl-row"><span class="k">Owing since</span><span class="v" style="font-family:Inter,sans-serif;">'+daysAgo(c.debtSince)+'</span></div>' : '') +
    '</div>';
    if((c.balance||0) > 0){
      html += '<button class="primary block" id="btn-record-payment" style="margin-bottom:18px;">Record payment</button>';
    }
    html += '<div class="section-row"><h2 style="font-size:14px;">Invoices</h2></div>';
    if(custInvoices.length===0){
      html += '<div class="empty" style="padding:30px 10px;"><p>No invoices for this customer yet.</p></div>';
    } else {
      html += '<div class="ledger">';
      custInvoices.forEach(function(inv){
        html += '<div class="row" data-open-invoice="'+inv.id+'">' +
          '<div class="left"><div class="title">Invoice #'+inv.number+'</div><div class="sub">'+new Date(inv.createdAt).toLocaleDateString()+'</div></div>' +
          '<div class="right"><div class="amount">'+fmt(inv.total)+'</div><span class="pill '+invPillClass(inv)+'">'+invPillLabel(inv)+'</span></div>' +
        '</div>';
      });
      html += '</div>';
    }

    html += '<div class="section-row" style="margin-top:18px;"><h2 style="font-size:14px;">Payments received</h2></div>';
    if(payments.length===0){
      html += '<div class="empty" style="padding:20px 10px;"><p>No payments recorded yet.</p></div>';
    } else {
      html += '<div class="ledger">';
      payments.forEach(function(p){
        html += '<div class="row" style="cursor:default;">' +
          '<div class="left"><div class="title">Payment</div><div class="sub">'+new Date(p.date).toLocaleString()+'</div></div>' +
          '<div class="right"><div class="amount" style="color:var(--green);">'+fmt(p.amount)+'</div></div>' +
        '</div>';
      });
      html += '</div>';
    }
    return html;
  }

  function daysAgo(ts){
    var days = Math.max(0, Math.floor((Date.now()-ts)/86400000));
    if(days===0) return 'Today';
    if(days===1) return '1 day';
    return days+' days';
  }

  function renderProductDetail(){
    var p = state.products.find(function(x){ return x.id===detail.id; });
    if(!p){ detail=null; return renderInventoryList(); }
    var html = '<button class="back-btn" id="btn-back">'+ICONS.back+' Back</button>';
    html += '<div class="detail-card">' +
      '<div class="dl-row"><span class="k">Item</span><span class="v" style="font-family:Inter,sans-serif;">'+escapeHtml(p.name)+'</span></div>' +
      '<div class="dl-row"><span class="k">SKU / Barcode</span><span class="v">'+escapeHtml(p.sku||'—')+'</span></div>' +
      '<div class="dl-row"><span class="k">Selling price</span><span class="v">'+fmt(p.price)+'</span></div>' +
      (isOwner() && p.costPrice ? '<div class="dl-row"><span class="k">Cost price</span><span class="v">'+fmt(p.costPrice)+'</span></div>' : '') +
      (isOwner() && p.costPrice ? '<div class="dl-row"><span class="k">Profit per unit</span><span class="v" style="color:var(--green);">'+fmt(p.price-p.costPrice)+'</span></div>' : '') +
      '<div class="dl-row"><span class="k">Quantity</span><span class="v">'+p.qty+'</span></div>' +
    '</div>';
    html += '<div style="display:flex;gap:10px;">' +
      '<button class="secondary block" id="btn-restock">'+(isOwner()?'Adjust stock':'Update quantity')+'</button>' +
      (isOwner() ? '<button class="secondary danger block" id="btn-delete-product">Delete</button>' : '') +
    '</div>';
    return html;
  }

  function invoiceCustName(inv){
    if(inv.customerId){ var c=findCustomer(inv.customerId); return c?c.name:'Walk-in'; }
    return inv.customerName || 'Walk-in';
  }
  function invPillClass(inv){
    if(inv.voided) return 'voided';
    if(inv.type==='credit') return 'credit';
    if(inv.type==='partial') return 'partial';
    return 'paid';
  }
  function invPillLabel(inv){
    if(inv.voided) return 'Voided';
    if(inv.type==='credit') return 'Credit';
    if(inv.type==='partial') return 'Partial';
    return 'Paid';
  }
  function invStatusLong(inv){
    if(inv.type==='credit') return 'On credit';
    if(inv.type==='partial') return 'Partly paid — '+fmt(inv.amountPaid||0)+' of '+fmt(inv.total);

  function myRole(){
    // Legacy shops created before roles existed have no roles map at all —
    // don't lock the real owner out of their own shop in that case.
    if(!state.roles || Object.keys(state.roles).length===0) return 'owner';
    return state.roles[currentUser.email] || 'staff';

  function invoiceProfit(inv){
    if(inv.voided) return 0;
    return inv.items.reduce(function(s,it){ return s + (it.price - (it.cost||0)) * it.qty; }, 0);
  }

  // ---------- LOGO ----------
  function handleLogoUpload(file){
    if(!file.type || file.type.indexOf('image/')!==0){ showToast('Please choose an image file'); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxDim = 200;
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width*scale));
        var h = Math.max(1, Math.round(img.height*scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/png');
        if(dataUrl.length > 600000){
          showToast('That image is too large — try a smaller, simpler logo');
          return;
        }
        state.shopLogo = dataUrl;
        saveData();
        closeSheet();
        render();
        showToast('Logo updated');
      };
      img.onerror = function(){ showToast('Could not read that image'); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------- SALES SUMMARY ----------
  var summaryPeriod = 'today';
  function periodStart(period){
    var now = new Date();
    if(period==='today'){ return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(); }
    if(period==='week'){ return Date.now() - 7*86400000; }
    if(period==='month'){ return Date.now() - 30*86400000; }
    return 0;
  }
  function computeSummary(period){
    var start = periodStart(period);
    var invs = state.invoices.filter(function(i){ return !i.voided && i.createdAt >= start; });
    var sales = invs.reduce(function(s,i){ return s+i.total; }, 0);
    var profit = invs.reduce(function(s,i){ return s+invoiceProfit(i); }, 0);
    var itemTotals = {};
    invs.forEach(function(inv){
      inv.items.forEach(function(it){
        if(!itemTotals[it.name]) itemTotals[it.name] = { qty:0, revenue:0 };
        itemTotals[it.name].qty += it.qty;
        itemTotals[it.name].revenue += it.qty*it.price;
      });
    });
    var topItems = Object.keys(itemTotals).map(function(name){
      return { name:name, qty:itemTotals[name].qty, revenue:itemTotals[name].revenue };
    }).sort(function(a,b){ return b.revenue-a.revenue; }).slice(0,5);
    return { count: invs.length, sales: sales, profit: profit, topItems: topItems };
  }

    summaryPeriod = 'today';

      '<button data-p="today" class="'+(summaryPeriod==='today'?'sel':'')+'">Today</button>' +

      '<button data-p="month" class="'+(summaryPeriod==='month'?'sel':'')+'">30 days</button>' +
    '</div>';
    html += '<div class="totals-strip" style="margin-top:14px;">' +
      '<div class="stat"><div class="label">Sales</div><div class="value">'+fmt(s.sales)+'</div></div>' +
      '<div class="stat"><div class="label">Profit</div><div class="value">'+fmt(s.profit)+'</div></div>' +
    '</div>';
    html += '<div class="scan-note" style="text-align:left;margin-bottom:14px;">'+s.count+' invoice'+(s.count!==1?'s':'')+' in this period (voided invoices excluded)</div>';
    html += '<label style="margin-top:0;">Top-selling items</label>';
    if(s.topItems.length===0){

        '</div>';
      });
      html += '</div>';
    }
    return html;
  }

  function exportInvoicesXlsx(){
    if(typeof XLSX==='undefined'){ showToast('Excel library failed to load'); return; }
    var rows = [];
    state.invoices.slice().sort(function(a,b){return a.createdAt-b.createdAt;}).forEach(function(inv){
      var custName = invoiceCustName(inv);
      inv.items.forEach(function(it){
        rows.push({
          Invoice: inv.number,
          Date: new Date(inv.createdAt).toLocaleDateString(),
          Customer: custName,
          Status: invPillLabel(inv),
          Item: it.name,
          Qty: it.qty,
          Price: it.price,
          Cost: it.cost||0,
          LineTotal: it.qty*it.price,
          LineProfit: (it.price-(it.cost||0))*it.qty,
          Voided: inv.voided ? 'Yes' : 'No'
        });
      });
    });
    var ws = XLSX.utils.json_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Invoices');
    XLSX.writeFile(wb, safeFileBase()+'_invoices.xlsx');
    showToast('Invoices exported');
  }

  function importInventoryXlsx(file){
    if(typeof XLSX==='undefined'){ showToast('Excel library failed to load'); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:'array'});
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws);
        var added=0, updated=0;
        rows.forEach(function(r){
          var name = r.Name || r.name || r.Item || r.item;
          if(!name) return;
          var sku = String(r.SKU || r.sku || r.Barcode || r.barcode || '').trim();
          var price = parseFloat(r.Price || r.price) || 0;
          var qty = parseInt(r.Quantity || r.quantity || r.Qty || r.qty) || 0;
          var existing = sku ? state.products.find(function(p){ return p.sku && p.sku.toLowerCase()===sku.toLowerCase(); }) : null;
          if(existing){
            existing.qty += qty;
            if(price) existing.price = price;
            updated++;
          } else {
            state.products.push({ id:uid(), name:String(name), sku:sku, price:price, qty:qty });
            added++;
          }
        });
        saveData();
        closeSheet();
        view='inventory'; detail=null;
        render();
        showToast(added+' added, '+updated+' restocked');
      }catch(err){
        showToast('Could not read that file — check the format');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ---------- NEW INVOICE SHEET ----------
  var draftInvoice = null;
  function openNewInvoiceSheet(prefill){
    if(prefill){
      draftInvoice = {
        customerId: prefill.customerId || null,
        customerName: prefill.customerName || '',
        type: prefill.type || 'cash',
        items: prefill.items.map(function(it){ return Object.assign({}, it); }), // deep-ish copy
        amountPaid: prefill.amountPaid || 0
      };
    } else {
      draftInvoice = { customerId:null, customerName:'', type:'cash', items:[], amountPaid:0 };
    }
    openSheet({
      html: renderInvoiceSheetHtml,
      attach: attachInvoiceSheetEvents
    });
  }

  function voidInvoice(invId){
    var inv = state.invoices.find(function(i){ return i.id===invId; });
    if(!inv || inv.voided) return;

    // restore stock
    inv.items.forEach(function(it){
      var p = findProduct(it.productId);
      if(p) p.qty += it.qty;
    });

    // reverse any debt this invoice added
    if((inv.type==='credit' || inv.type==='partial') && inv.customerId){
      var c = findCustomer(inv.customerId);
      if(c){
        var addedAmount = inv.type==='credit' ? inv.total : (inv.total - (inv.amountPaid||0));
        c.balance = Math.max(0, (c.balance||0) - addedAmount);
        if(c.balance === 0) c.debtSince = null;
      }
    }

    inv.voided = true;
    inv.voidedAt = Date.now();
    saveData();
  }

  function editInvoice(invId){
    var inv = state.invoices.find(function(i){ return i.id===invId; });
    if(!inv) return;
    if(!confirm('This marks the current invoice as voided (stock and debt are reversed) and opens a fresh copy for you to correct and save. Continue?')) return;
    voidInvoice(invId);
    detail = null; view = 'invoices';
    openNewInvoiceSheet({
      customerId: inv.customerId,
      customerName: inv.customerName,
      type: inv.type,
      items: inv.items,
      amountPaid: inv.amountPaid
    });
  }

  function renderInvoiceSheetHtml(){
    var html = '<div class="sheet-head"><h2>New invoice</h2><button class="close" id="sheet-close">&times;</button></div>';

    html += '<label>Customer</label>';
    html += '<div class="toggle-group" id="pay-type">' +
      '<button data-t="cash" class="'+(draftInvoice.type==='cash'?'sel':'')+'">Cash sale</button>' +
      '<button data-t="credit" class="'+(draftInvoice.type==='credit'?'sel':'')+'">On credit</button>' +
      '<button data-t="partial" class="'+(draftInvoice.type==='partial'?'sel':'')+'">Part payment</button>' +
    '</div>';

    if(draftInvoice.type==='credit' || draftInvoice.type==='partial'){
      html += '<div class="search-add" style="margin-top:10px;">' +
        '<input id="cust-search" placeholder="Search or add customer…" autocomplete="off" value="'+(draftInvoice.customerId? escapeHtml(findCustomer(draftInvoice.customerId).name):'')+'">' +
        '<div id="cust-suggest"></div>' +
      '</div>';
    } else {
      html += '<input id="cash-cust-name" placeholder="Customer name (optional)" autocomplete="off" style="margin-top:10px;" value="'+escapeHtml(draftInvoice.customerName||'')+'">';
    }

    html += '<label style="margin-top:16px;">Add items</label>';
    html += '<div class="search-add">' +
      '<input id="item-search" placeholder="Search product or scan barcode…" autocomplete="off">' +
      '<div id="item-suggest"></div>' +
    '</div>';

    html += '<div id="invoice-items" style="margin-top:12px;">' + renderDraftItems() + '</div>';

    var total = draftInvoice.items.reduce(function(s,it){ return s+it.qty*it.price; },0);
    html += '<div class="total-line"><span class="l">Total</span><span class="v">'+fmt(total)+'</span></div>';

    if(draftInvoice.type==='partial'){
      var paid = draftInvoice.amountPaid || 0;
      var remaining = Math.max(0, total - paid);
      html += '<label>Amount paid now</label>';
      html += '<input id="partial-paid" type="number" step="0.01" class="num-input" placeholder="0.00" value="'+(draftInvoice.amountPaid!=null ? draftInvoice.amountPaid : '')+'">';
      html += '<div class="scan-note" style="text-align:left;">Remaining balance added to their debt: <strong style="color:var(--red);">'+fmt(remaining)+'</strong></div>';
    }

    html += '<button class="primary block" id="save-invoice" style="margin-top:18px;">Save &amp; print</button>';
    return html;
  }

  function renderDraftItems(){
    if(draftInvoice.items.length===0){
      return '<div class="scan-note">No items added yet.</div>';
    }
    return draftInvoice.items.map(function(it,idx){
      return '<div class="item-line">' +
        '<div class="info"><div class="n">'+escapeHtml(it.name)+'</div><div class="p">'+fmt(it.price)+' each</div></div>' +
        '<div class="qty-stepper">' +
          '<button data-dec="'+idx+'">−</button>' +
          '<input type="number" min="1" class="num-input" data-qty="'+idx+'" value="'+it.qty+'" style="width:44px;text-align:center;padding:4px 2px;">' +
          '<button data-inc="'+idx+'">+</button>' +
        '</div>' +
        '<div class="lt">'+fmt(it.qty*it.price)+'</div>' +
        '<button class="rm" data-rm="'+idx+'">&times;</button>' +
      '</div>';
    }).join('');
  }

  function refreshInvoiceSheet(){
    var el = document.getElementById('sheet-inner');
    if(el){ el.innerHTML = renderInvoiceSheetHtml(); attachInvoiceSheetEvents(); }
  }

  function attachInvoiceSheetEvents(){
    document.getElementById('sheet-close').addEventListener('click', closeSheet);

    document.querySelectorAll('#pay-type button').forEach(function(b){
      b.addEventListener('click', function(){
        draftInvoice.type = b.getAttribute('data-t');
        if(draftInvoice.type==='cash') draftInvoice.customerId=null;
        refreshInvoiceSheet();
      });
    });

    var partialPaid = document.getElementById('partial-paid');
    if(partialPaid){
      partialPaid.addEventListener('change', function(){
        var v = parseFloat(partialPaid.value);
        draftInvoice.amountPaid = (v>=0) ? v : 0;
        refreshInvoiceSheet();
      });
    }

    var custSearch = document.getElementById('cust-search');
    var cashName = document.getElementById('cash-cust-name');
    if(cashName){
      cashName.addEventListener('change', function(){ draftInvoice.customerName = cashName.value; });
    }
    if(custSearch){
      custSearch.addEventListener('input', function(){
        var q = custSearch.value.trim().toLowerCase();
        var box = document.getElementById('cust-suggest');
        if(!q){ box.innerHTML=''; return; }
        var matches = state.customers.filter(function(c){ return c.name.toLowerCase().indexOf(q)>-1; });
        var html = '<div class="suggest">';
        matches.slice(0,6).forEach(function(c){
          html += '<div class="opt" data-pick-cust="'+c.id+'"><span class="n">'+escapeHtml(c.name)+'</span><span class="s">'+fmt(c.balance||0)+' owed</span></div>';
        });
        html += '<div class="opt" data-new-cust="1"><span class="n">+ New customer "'+escapeHtml(custSearch.value.trim())+'"</span></div>';
        html += '</div>';
        box.innerHTML = html;
        box.querySelectorAll('[data-pick-cust]').forEach(function(o){
          o.addEventListener('click', function(){
            draftInvoice.customerId = o.getAttribute('data-pick-cust');
            document.getElementById('cust-suggest').innerHTML='';
            custSearch.value = findCustomer(draftInvoice.customerId).name;
          });
        });
        var nc = box.querySelector('[data-new-cust]');
        if(nc) nc.addEventListener('click', function(){
          var name = custSearch.value.trim();
          if(!name) return;
          var c = {id:uid(), name:name, phone:'', balance:0};
          state.customers.push(c);
          draftInvoice.customerId = c.id;
          document.getElementById('cust-suggest').innerHTML='';
        });
      });
    }

    var itemSearch = document.getElementById('item-search');
    itemSearch.addEventListener('input', function(){
      var q = itemSearch.value.trim().toLowerCase();
      var box = document.getElementById('item-suggest');
      if(!q){ box.innerHTML=''; return; }
      var matches = state.products.filter(function(p){
        return p.name.toLowerCase().indexOf(q)>-1 || (p.sku||'').toLowerCase().indexOf(q)>-1;
      });
      if(matches.length===0){ box.innerHTML = '<div class="suggest"><div class="opt"><span class="s">No matching items</span></div></div>'; return; }
      var html = '<div class="suggest">';
      matches.slice(0,8).forEach(function(p){
        html += '<div class="opt" data-pick-item="'+p.id+'" style="'+(p.qty<=0?'opacity:0.45;':'')+'"><span class="n">'+escapeHtml(p.name)+'</span><span class="s">'+fmt(p.price)+' · '+(p.qty<=0?'Out of stock':(p.qty+' left'))+'</span></div>';
      });
      html += '</div>';
      box.innerHTML = html;
      box.querySelectorAll('[data-pick-item]').forEach(function(o){
        o.addEventListener('click', function(){
          addDraftItem(o.getAttribute('data-pick-item'));
          itemSearch.value=''; box.innerHTML='';
        });
      });
    });
    itemSearch.addEventListener('keydown', function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        var q = itemSearch.value.trim().toLowerCase();
        var match = state.products.find(function(p){ return (p.sku||'').toLowerCase()===q; });
        if(match){ addDraftItem(match.id); itemSearch.value=''; document.getElementById('item-suggest').innerHTML=''; }
      }
    });

    bindItemLineEvents();

    document.getElementById('save-invoice').addEventListener('click', commitInvoice);
  }

  function bindItemLineEvents(){
    document.querySelectorAll('[data-inc]').forEach(function(b){
      b.addEventListener('click', function(){
        var i = parseInt(b.getAttribute('data-inc'));
        var it = draftInvoice.items[i];
        var p = findProduct(it.productId);
        var stock = p ? p.qty : Infinity;
        if(it.qty + 1 > stock){ showToast('Only '+stock+' in stock'); return; }
        it.qty++;
        refreshInvoiceSheet();
      });
    });
    document.querySelectorAll('[data-dec]').forEach(function(b){
      b.addEventListener('click', function(){
        var i = parseInt(b.getAttribute('data-dec'));
        draftInvoice.items[i].qty = Math.max(1, draftInvoice.items[i].qty-1);
        refreshInvoiceSheet();
      });
    });
    document.querySelectorAll('[data-qty]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var i = parseInt(inp.getAttribute('data-qty'));
        var it = draftInvoice.items[i];
        var p = findProduct(it.productId);
        var stock = p ? p.qty : Infinity;
        var v = parseInt(inp.value);
        if(!v || v<1) v = 1;
        if(v > stock){ showToast('Only '+stock+' in stock'); v = stock; }
        it.qty = v;
        refreshInvoiceSheet();
      });
    });
    document.querySelectorAll('[data-rm]').forEach(function(b){
      b.addEventListener('click', function(){
        var i = parseInt(b.getAttribute('data-rm'));
        draftInvoice.items.splice(i,1);
        refreshInvoiceSheet();
      });
    });
  }

  function addDraftItem(productId){
    var p = findProduct(productId);
    if(!p) return;
    if(p.qty <= 0){ showToast(p.name+' is out of stock'); return; }
    var existing = draftInvoice.items.find(function(it){ return it.productId===productId; });
    if(existing){
      if(existing.qty + 1 > p.qty){ showToast('Only '+p.qty+' in stock'); return; }
      existing.qty++;
    }
    else{ draftInvoice.items.push({ productId:p.id, name:p.name, price:p.price, cost:(p.costPrice||0), qty:1 }); }
    refreshInvoiceSheet();
  }

  function commitInvoice(){
    if(draftInvoice.items.length===0){ showToast('Add at least one item'); return; }
    if((draftInvoice.type==='credit' || draftInvoice.type==='partial') && !draftInvoice.customerId){ showToast('Pick or add a customer'); return; }

    // Read the live value directly — on mobile, tapping Save right after typing
    // can fire before the input's 'change' event, leaving the typed amount unsaved.
    if(draftInvoice.type==='partial'){
      var liveInput = document.getElementById('partial-paid');
      if(liveInput){
        var liveVal = parseFloat(liveInput.value);
        draftInvoice.amountPaid = (liveVal>=0) ? liveVal : (draftInvoice.amountPaid||0);
      }
    }

    // Final stock safety check — stock may have changed since items were added
    for(var k=0; k<draftInvoice.items.length; k++){
      var itChk = draftInvoice.items[k];
      var pChk = findProduct(itChk.productId);
      if(pChk && itChk.qty > pChk.qty){
        showToast(pChk.name+' only has '+pChk.qty+' left — adjust quantity');
        return;
      }
    }

    var total = draftInvoice.items.reduce(function(s,it){ return s+it.qty*it.price; },0);
    var amountPaid = 0;
    var balanceDue = 0;
    if(draftInvoice.type==='partial'){
      amountPaid = Math.max(0, Math.min(draftInvoice.amountPaid||0, total));
      balanceDue = total - amountPaid;
    }

    var inv = {
      id: uid(),
      number: state.nextInvoiceNo,
      customerId: draftInvoice.customerId,
      customerName: draftInvoice.type==='cash' ? (draftInvoice.customerName||'').trim() : '',
      type: draftInvoice.type,
      items: draftInvoice.items,
      total: total,
      amountPaid: draftInvoice.type==='partial' ? amountPaid : (draftInvoice.type==='cash' ? total : 0),
      soldBy: currentUser ? currentUser.email : '',
      createdAt: Date.now()
    };
    state.nextInvoiceNo++;
    state.invoices.push(inv);

    // decrement stock
    draftInvoice.items.forEach(function(it){
      var p = findProduct(it.productId);
      if(p) p.qty = Math.max(0, p.qty - it.qty);
    });

    // add to customer balance for credit (full) or partial (remainder only)
    if(draftInvoice.type==='credit' || draftInvoice.type==='partial'){
      var c = findCustomer(draftInvoice.customerId);
      var addAmount = draftInvoice.type==='credit' ? total : balanceDue;
      if(c && addAmount > 0){
        c.balance = (c.balance||0) + addAmount;
        if(!c.debtSince) c.debtSince = Date.now();
      }
    }

    saveData();
    closeSheet();
    view='invoices'; detail={type:'invoice', id:inv.id};
    render();
    showToast('Invoice #'+inv.number+' saved');
  }

  // ---------- RECEIPT TEXT (shared by WhatsApp share and the print QR code) ----------
  function invoiceBalanceDue(inv){
    if(inv.type==='credit') return inv.total;
    if(inv.type==='partial') return Math.max(0, inv.total - (inv.amountPaid||0));
    return 0;
  }

  function buildReceiptLines(inv){
    var custName = invoiceCustName(inv);
    var lines = [];
    lines.push('*'+state.shopName+'*');
    lines.push('Invoice #'+inv.number+' · '+new Date(inv.createdAt).toLocaleDateString());
    lines.push('Customer: '+custName);
    if(inv.soldBy) lines.push('Sold by: '+staffName(inv.soldBy));
    lines.push('');
    inv.items.forEach(function(it){
      lines.push(it.name+' x'+it.qty+' — '+fmt(it.qty*it.price));
    });
    lines.push('');
    lines.push('*Total: '+fmt(inv.total)+'*');
    lines.push('Status: '+invStatusLong(inv));
    var balance = invoiceBalanceDue(inv);
    if(balance > 0) lines.push('*Balance due: '+fmt(balance)+'*');
    lines.push('');
    lines.push('Thank you for your business!');
    return lines;
  }

  function receiptWhatsappUrl(inv){
    return 'https://wa.me/?text=' + encodeURIComponent(buildReceiptLines(inv).join('\n'));
  }

  // ---------- PRINT ----------
  function printInvoice(invId){
    var inv = state.invoices.find(function(i){ return i.id===invId; });
    if(!inv) return;
    var custName = invoiceCustName(inv);
    var logoEl = document.getElementById('pr-logo');
    if(state.shopLogo){ logoEl.src = state.shopLogo; logoEl.style.display = 'block'; }
    else { logoEl.style.display = 'none'; }
    document.getElementById('pr-shop').textContent = state.shopName;
    document.getElementById('pr-meta').textContent = 'Invoice #'+inv.number+' · '+new Date(inv.createdAt).toLocaleString()+' · '+custName;
    var itemsHtml = '';
    inv.items.forEach(function(it){
      itemsHtml += '<div class="pr-row"><span>'+escapeHtml(it.name)+' x'+it.qty+'</span><span>'+fmt(it.qty*it.price)+'</span></div>';
    });
    document.getElementById('pr-items').innerHTML = itemsHtml;
    document.getElementById('pr-total').textContent = fmt(inv.total);
    document.getElementById('pr-status-row').innerHTML = '<span>Status</span><span>'+invStatusLong(inv).toUpperCase()+'</span>';

    var balance = invoiceBalanceDue(inv);
    var balanceEl = document.getElementById('pr-balance-row');
    balanceEl.innerHTML = balance>0 ? '<span><strong>BALANCE DUE</strong></span><span><strong>'+fmt(balance)+'</strong></span>' : '';

    var soldByEl = document.getElementById('pr-soldby-row');
    soldByEl.innerHTML = inv.soldBy ? '<span>Sold by</span><span>'+escapeHtml(staffName(inv.soldBy))+'</span>' : '';

    var qrEl = document.getElementById('pr-qr');
    var qrCaption = document.getElementById('pr-qr-caption');
    qrEl.innerHTML = '';
    if(typeof QRCode !== 'undefined'){
      try{
        new QRCode(qrEl, { text: receiptWhatsappUrl(inv), width:90, height:90 });
        qrCaption.style.display = 'block';
      }catch(e){ qrCaption.style.display = 'none'; }
    } else {
      qrCaption.style.display = 'none';
    }

    window.print();
  }

  function shareInvoiceWhatsapp(invId){
    var inv = state.invoices.find(function(i){ return i.id===invId; });
    if(!inv) return;
    window.open(receiptWhatsappUrl(inv), '_blank');

  // ---------- SCANNER ----------
  var scannerStream = null;
  var scannerRAF = null;
  var barcodeDetector = null;

  function openScanSheet(){
    openSheet({
      html: function(){
        return '<div class="sheet-head"><h2>Scan barcode</h2><button class="close" id="sheet-close">&times;</button></div>' +
          '<div class="scanbox" id="scanbox"><video id="scan-video" autoplay playsinline muted></video></div>' +
          '<div class="scan-note" id="scan-status">Starting camera…</div>' +
          '<label>Or enter code manually</label>' +
          '<div class="row-2">' +
          '<div><input id="manual-code" class="num-input" placeholder="SKU or barcode"></div>' +
          '<div><button class="secondary block" id="manual-go">Look up</button></div>' +
          '</div>';
      },
      attach: function(){
        document.getElementById('manual-go').addEventListener('click', function(){
          handleScannedCode(document.getElementById('manual-code').value.trim());
        });
        document.getElementById('manual-code').addEventListener('keydown', function(e){

        });

  function startScanner(){
    var statusEl = document.getElementById('scan-status');
    if(!('mediaDevices' in navigator) || !navigator.mediaDevices.getUserMedia){
      statusEl.textContent = 'Camera not available — enter the code manually below.';
      return;
    }
    if(!('BarcodeDetector' in window)){
      statusEl.textContent = 'Live scanning isn\'t supported in this browser — enter the code manually below.';
    }
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } }).then(function(stream){
      scannerStream = stream;
      var video = document.getElementById('scan-video');
      if(!video) { stream.getTracks().forEach(function(t){t.stop();}); return; }
      video.srcObject = stream;
      if('BarcodeDetector' in window){
        statusEl.textContent = 'Point the camera at a barcode…';
        try{
          barcodeDetector = new window.BarcodeDetector();
        }catch(e){ barcodeDetector = new window.BarcodeDetector({formats:['ean_13','ean_8','code_128','upc_a','upc_e','qr_code']}); }
        scanLoop(video, statusEl);
      }
    }).catch(function(err){
      statusEl.textContent = 'Camera access denied — enter the code manually below.';
    });
  }

  function scanLoop(video, statusEl){
    if(!document.getElementById('scan-video')){ return; } // sheet closed
    barcodeDetector.detect(video).then(function(codes){
      if(codes && codes.length>0){
        handleScannedCode(codes[0].rawValue);
        return;
      }
      scannerRAF = requestAnimationFrame(function(){ scanLoop(video, statusEl); });
    }).catch(function(){
      scannerRAF = requestAnimationFrame(function(){ scanLoop(video, statusEl); });
    });
  }

  function stopScanner(){
    if(scannerRAF) cancelAnimationFrame(scannerRAF);
    scannerRAF = null;
    barcodeDetector = null;
    if(scannerStream){
      scannerStream.getTracks().forEach(function(t){ t.stop(); });
      scannerStream = null;
    }
  }

  function handleScannedCode(code){
    if(!code) return;
    stopScanner();
    var p = state.products.find(function(x){ return (x.sku||'').toLowerCase()===code.toLowerCase(); });
    closeSheet();
    if(p){
      detail = {type:'product', id:p.id};
      view = 'inventory';
      render();
      showToast('Found: '+p.name);
    } else if(isOwner()){
      openProductSheet(code);
      showToast('No item with that code — add it');
    } else {
      showToast('No item with that code — ask the shop owner to add it');
    }
  }

  // ---------- INIT ----------
  loadData();

})();
</script>
</body>
</html>
